<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSS Box Model &amp; Display Lab (Refined: Side-Specific)</title>
<style>
  * { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; box-sizing: border-box; }
  body { margin: 0; background: #f4f5f7; color: #222; }
  h1 { font-size: 1.4rem; margin: 0; padding: 16px 24px; background: #1f2937; color: #fff; }
  .layout { display: flex; flex-wrap: wrap; gap: 20px; padding: 20px; align-items: flex-start; }
  .panel { background: #fff; border-radius: 10px; padding: 18px; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  .controls { flex: 0 0 340px; max-height: calc(100vh - 110px); overflow-y: auto; }
  .stage-wrap { flex: 1 1 420px; min-width: 300px; position: sticky; top: 20px; }
  fieldset { border: 1px solid #d1d5db; border-radius: 8px; margin: 0 0 14px; padding: 10px 12px; }
  legend { font-weight: 700; padding: 0 6px; font-size: .9rem; }
  .row { margin-bottom: 8px; }
  .row label { display: flex; justify-content: space-between; font-size: .82rem; margin-bottom: 2px; }
  .row .val { font-weight: 700; color: #2563eb; }
  input[type=range] { width: 100%; }
  select { width: 100%; padding: 6px; }
  .link-btn { font-size: .75rem; margin-top: 4px; cursor: pointer; padding: 3px 8px; }

  #stage { position: relative; isolation: isolate; background: #fff; border: 2px dashed #9ca3af;
           padding: 12px; min-height: 320px; line-height: 1.2; overflow: auto; }
  .box { position: relative; text-align: center; font-weight: 700; }

  /* Box 1: content-box sizing so "width" = content width. CSS variables drive every side. */
  #box1 {
    --mt: 20px; --mr: 20px; --mb: 20px; --ml: 20px;
    --bt: 6px;  --br: 6px;  --bb: 6px;  --bl: 6px;
    box-sizing: content-box;
    width: 120px; height: 50px; line-height: 50px;
    margin: var(--mt) var(--mr) var(--mb) var(--ml);
    padding: 20px;
    border-style: solid; border-color: #1e3a8a;
    border-width: var(--bt) var(--br) var(--bb) var(--bl);
    border-radius: 0;
    background:
      linear-gradient(#a7f3d0, #a7f3d0) content-box,
      linear-gradient(#fde68a, #fde68a) padding-box;
    display: block;
  }
  /* Margin area: extends out from the padding edge by (border + margin) on each side */
  #box1::before {
    content: ""; position: absolute; z-index: -1; background: #fdba74;
    top: calc(-1 * (var(--mt) + var(--bt)));
    right: calc(-1 * (var(--mr) + var(--br)));
    bottom: calc(-1 * (var(--mb) + var(--bb)));
    left: calc(-1 * (var(--ml) + var(--bl)));
  }
  #box2 { background: #c7d2fe; border: 2px solid #4338ca; padding: 10px; margin: 0; }

  .legend-row { display: flex; gap: 12px; flex-wrap: wrap; font-size: .8rem; margin-top: 12px; }
  .legend-row span::before { content: ""; display: inline-block; width: 12px; height: 12px; margin-right: 5px; vertical-align: -1px; border: 1px solid #555; }
  .l-m::before { background: #fdba74; } .l-b::before { background: #1e3a8a; }
  .l-p::before { background: #fde68a; } .l-c::before { background: #a7f3d0; }
  pre { background: #111827; color: #d1fae5; padding: 12px; border-radius: 8px; font-size: .78rem; overflow: auto; margin: 12px 0 0; }
  .note { font-size: .8rem; color: #6b7280; }
</style>
</head>
<body>
<h1>CSS Box Model &amp; Display Lab: Side-Specific Controls</h1>
<div class="layout">
  <div class="panel controls" id="controls">
    <fieldset><legend>Size &amp; Display</legend>
      <div class="row"><label>Width <span class="val" id="v-width">120px</span></label>
        <input type="range" id="width" min="40" max="400" value="120"></div>
      <div class="row"><label>Corner radius <span class="val" id="v-radius">0px</span></label>
        <input type="range" id="radius" min="0" max="80" value="0"></div>
      <div class="row"><label for="display">display</label>
        <select id="display">
          <option value="block">block</option>
          <option value="inline-block">inline-block</option>
          <option value="inline">inline</option>
        </select></div>
      <p class="note">On <code>inline</code>, width and vertical margin/padding effects stop behaving like a block. Toggle it and watch.</p>
    </fieldset>
    <!-- Margin / Padding / Border fieldsets are generated by JS below -->
  </div>

  <div class="panel stage-wrap">
    <div id="stage">
      <div class="box" id="box1">Box 1</div>
      <div class="box" id="box2">Box 2</div>
    </div>
    <div class="legend-row">
      <span class="l-m">Margin</span><span class="l-b">Border</span>
      <span class="l-p">Padding</span><span class="l-c">Content</span>
    </div>
    <pre id="css-out"></pre>
  </div>
</div>

<script>
  const box1 = document.getElementById('box1');
  const SIDES = ['top', 'right', 'bottom', 'left'];
  const GROUPS = [
    { key: 'margin',  label: 'Margin',  max: 80, start: 20 },
    { key: 'padding', label: 'Padding', max: 80, start: 20 },
    { key: 'border',  label: 'Border width', max: 30, start: 6 }
  ];
  const state = {};   // e.g. state['margin-top'] = 20

  // Build the per-side sliders
  const controls = document.getElementById('controls');
  GROUPS.forEach(g => {
    const fs = document.createElement('fieldset');
    fs.innerHTML = `<legend>${g.label}</legend>`;
    SIDES.forEach(side => {
      const id = `${g.key}-${side}`;
      state[id] = g.start;
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `<label for="${id}">${side} <span class="val" id="v-${id}">${g.start}px</span></label>
                       <input type="range" id="${id}" min="0" max="${g.max}" value="${g.start}">`;
      fs.appendChild(row);
    });
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'link-btn'; btn.textContent = 'Sync all sides to top';
    btn.addEventListener('click', () => {
      SIDES.forEach(side => { document.getElementById(`${g.key}-${side}`).value = document.getElementById(`${g.key}-top`).value; });
      update();
    });
    fs.appendChild(btn);
    controls.appendChild(fs);
  });

  function update() {
    // read all sliders
    GROUPS.forEach(g => SIDES.forEach(side => {
      const id = `${g.key}-${side}`;
      const v = document.getElementById(id).value;
      state[id] = v;
      document.getElementById('v-' + id).textContent = v + 'px';
    }));
    const w = document.getElementById('width').value;
    const r = document.getElementById('radius').value;
    document.getElementById('v-width').textContent = w + 'px';
    document.getElementById('v-radius').textContent = r + 'px';

    // margin + border go through CSS variables (the margin overlay needs them too)
    box1.style.setProperty('--mt', state['margin-top'] + 'px');
    box1.style.setProperty('--mr', state['margin-right'] + 'px');
    box1.style.setProperty('--mb', state['margin-bottom'] + 'px');
    box1.style.setProperty('--ml', state['margin-left'] + 'px');
    box1.style.setProperty('--bt', state['border-top'] + 'px');
    box1.style.setProperty('--br', state['border-right'] + 'px');
    box1.style.setProperty('--bb', state['border-bottom'] + 'px');
    box1.style.setProperty('--bl', state['border-left'] + 'px');

    box1.style.padding = SIDES.map(s => state['padding-' + s] + 'px').join(' ');
    box1.style.width = w + 'px';
    box1.style.borderRadius = r + 'px';
    box1.style.display = document.getElementById('display').value;

    document.getElementById('css-out').textContent =
`#box1 {
  display: ${box1.style.display};
  width: ${w}px;
  margin: ${SIDES.map(s => state['margin-' + s] + 'px').join(' ')};
  padding: ${SIDES.map(s => state['padding-' + s] + 'px').join(' ')};
  border-width: ${SIDES.map(s => state['border-' + s] + 'px').join(' ')};
  border-radius: ${r}px;
}`;
  }

  controls.addEventListener('input', update);
  controls.addEventListener('change', update);
  update();
</script>
</body>
</html>
